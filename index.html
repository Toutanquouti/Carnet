<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Carnet"><meta name="theme-color" content="#eceef1" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" type="image/png" href="icon-192.png"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Carnet muscu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Carnet muscu — une app de salle : sol en caoutchouc, disques de couleur, chiffres de tableau d'affichage.
   Mise en page : une colonne sur téléphone avec barre d'onglets en bas ; sur grand écran, navigation en haut et grilles. */
:root {
  --bg: #eceef1;
  --card: #ffffff;
  --inset: #f4f5f7;
  --line: #dde1e6;
  --line-2: #c8cdd4;
  --ink: #111418;
  --ink-2: #4a515b;
  --ink-3: #737b86;
  --accent: #111418;
  --on-accent: #ffffff;
  --push: #eb6834;
  --pull: #2a78d6;
  --legs: #1baf7a;
  --other: #8b929b;
  --good: #167a3a;
  --good-bg: #e2f3e7;
  --good-mark: #1f9d4b;
  --bad: #c0392f;
  --bad-bg: #fbe6e4;
  --bad-mark: #d64a3e;
  --warn: #8f5b00;
  --warn-bg: #fcf0d5;
  --info: #255aa8;
  --info-bg: #e3edfb;
  --gold: #9a6d00;
  --gold-mark: #f0b400;
  --gold-bg: #fff4d1;
  --warn-mark: #e09a1e;
  --good-soft: #5cbf7f;
  --grid: #e6e9ed;
  --axis: #bfc5cd;
  --scrim: rgba(12, 14, 17, 0.42);
  --pop: #ffffff;
  --pop-shadow: 0 10px 30px rgba(17, 20, 24, 0.16), 0 1px 3px rgba(17, 20, 24, 0.08);
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-card: 16px;
  --r-ctl: 12px;
  --tab-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0d10;
    --card: #15181d;
    --inset: #1b1f25;
    --line: #262b32;
    --line-2: #363c45;
    --ink: #eef0f3;
    --ink-2: #b3bac3;
    --ink-3: #868e99;
    --accent: #eef0f3;
    --on-accent: #0b0d10;
    --push: #d95926;
    --pull: #3987e5;
    --legs: #199e70;
    --other: #7d848e;
    --good: #5cc887;
    --good-bg: #12271a;
    --good-mark: #3fb56a;
    --bad: #f2837a;
    --bad-bg: #2d1615;
    --bad-mark: #e4594d;
    --warn: #ebb24f;
    --warn-bg: #2a2110;
    --info: #7eaef2;
    --info-bg: #13213a;
    --gold: #f3c652;
    --gold-mark: #f3c652;
    --gold-bg: #2a230e;
    --warn-mark: #e3a43a;
    --good-soft: #4aa771;
    --grid: #1f242b;
    --axis: #3a414b;
    --scrim: rgba(0, 0, 0, 0.6);
    --pop: #1e2228;
    --pop-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0d10;
  --card: #15181d;
  --inset: #1b1f25;
  --line: #262b32;
  --line-2: #363c45;
  --ink: #eef0f3;
  --ink-2: #b3bac3;
  --ink-3: #868e99;
  --accent: #eef0f3;
  --on-accent: #0b0d10;
  --push: #d95926;
  --pull: #3987e5;
  --legs: #199e70;
  --other: #7d848e;
  --good: #5cc887;
  --good-bg: #12271a;
  --good-mark: #3fb56a;
  --bad: #f2837a;
  --bad-bg: #2d1615;
  --bad-mark: #e4594d;
  --warn: #ebb24f;
  --warn-bg: #2a2110;
  --info: #7eaef2;
  --info-bg: #13213a;
  --gold: #f3c652;
  --gold-mark: #f3c652;
  --gold-bg: #2a230e;
  --warn-mark: #e3a43a;
  --good-soft: #4aa771;
  --grid: #1f242b;
  --axis: #3a414b;
  --scrim: rgba(0, 0, 0, 0.6);
  --pop: #1e2228;
  --pop-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: "";
  position: fixed;
  top: 0; left: 0; right: 0;
  height: env(safe-area-inset-top, 0px);
  z-index: 40;
  background: var(--bg);
}
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pull); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
svg { display: block; }

/* ── Coque ─────────────────────────────────────────────── */
.app {
  max-width: 1080px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 28px);
  min-height: 100%;
}
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: var(--bg);
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 56px;
  padding-block: 8px;
}
.topbar .back {
  width: 40px; height: 40px; margin-left: -8px;
  display: grid; place-items: center;
  border: 0; background: transparent; border-radius: 12px; color: var(--ink);
}
.topbar .back:active { background: var(--inset); }
.topbar .ttl { flex: 1; min-width: 0; }
.topbar .ttl h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 26px;
  line-height: 1.05;
  letter-spacing: 0.01em;
  overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.topbar .ttl h1.long { font-size: 22px; }
.topbar .ttl .sub { color: var(--ink-3); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand .plate { width: 30px; height: 30px; flex: none; }
.brand-word { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: 0.08em; text-transform: uppercase; }
.topbar .actions { display: flex; gap: 6px; align-items: center; }
.sync { font-size: 12px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--good-mark); display: inline-block; }
.sync.local i { background: var(--warn); }
.sync.busy i { background: var(--info); }
.sync.err i { background: var(--bad-mark); }

.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 35;
  display: flex; justify-content: center;
  background: var(--card);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.tabs .wrap { display: flex; width: 100%; max-width: 640px; }
.tab {
  flex: 1; height: var(--tab-h);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  border: 0; background: transparent; color: var(--ink-3);
  font-size: 11.5px; font-weight: 600; letter-spacing: 0.02em;
}
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--ink); }
.tab .dot { position: absolute; }
.tab.live { position: relative; }
.tab.live::after { content: ""; position: absolute; top: 10px; right: calc(50% - 18px); width: 8px; height: 8px; border-radius: 50%; background: var(--good-mark); box-shadow: 0 0 0 2px var(--card); }

@media (min-width: 900px) {
  .tabs { position: sticky; top: env(safe-area-inset-top, 0px); bottom: auto; border-top: 0; border-bottom: 1px solid var(--line); background: var(--bg); z-index: 31; padding-bottom: 0; }
  .tabs .wrap { max-width: 1080px; padding-inline: 16px; gap: 4px; }
  .tab { flex: none; flex-direction: row; height: 48px; padding: 0 14px; gap: 8px; font-size: 14px; border-radius: 0; border-bottom: 2px solid transparent; }
  .tab svg { width: 20px; height: 20px; }
  .tab[aria-current="page"] { border-bottom-color: var(--ink); }
  .tab.live::after { top: 12px; right: 4px; }
  .app { padding-bottom: 48px; }
  .topbar { top: calc(env(safe-area-inset-top, 0px) + 49px); }
}

/* ── Typo & blocs ──────────────────────────────────────── */
.view { display: grid; gap: 18px; padding-top: 4px; }
.sec { display: grid; gap: 10px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.eyebrow {
  font-family: var(--font-display); font-weight: 600; font-size: 13px;
  text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-3);
}
.h2 { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.1; letter-spacing: 0.01em; }
.h3 { font-weight: 600; font-size: 16px; line-height: 1.25; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.big {
  font-family: var(--font-display); font-weight: 600; font-size: 38px; line-height: 1; letter-spacing: 0.005em;
}
.big .u { font-size: 0.5em; font-weight: 600; color: var(--ink-2); margin-left: 3px; letter-spacing: 0.02em; }
.mid { font-family: var(--font-display); font-weight: 600; font-size: 24px; line-height: 1.05; }
.link { color: var(--ink); background: none; border: 0; padding: 0; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
.linkrow { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; padding: 4px 0; color: var(--ink-2); font-weight: 600; font-size: 14px; }
.linkrow svg { width: 16px; height: 16px; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  padding: 16px;
  min-width: 0;
}
.card.flat { background: transparent; border-style: dashed; }
.card.tap { cursor: pointer; text-align: left; width: 100%; font: inherit; color: inherit; display: block; }
.card.tap:active { background: var(--inset); }
.card-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.card-h .h3 { min-width: 0; }
.card .note { color: var(--ink-3); font-size: 13px; margin-top: 2px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.grid.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr)); }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.tile .lbl { font-size: 12.5px; color: var(--ink-3); font-weight: 500; }
.tile .val { font-family: var(--font-display); font-weight: 600; font-size: 28px; line-height: 1.05; }
.tile .val .u { font-size: 0.55em; color: var(--ink-2); margin-left: 2px; }
.tile .det { font-size: 12.5px; color: var(--ink-3); }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row.between { justify-content: space-between; }
.row.wrap { flex-wrap: wrap; }
.stack { display: grid; gap: 8px; }
.hr { height: 1px; background: var(--line); border: 0; margin: 4px 0; }

/* puces */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: 999px;
  font-size: 12.5px; font-weight: 600; line-height: 1.4;
  background: var(--inset); color: var(--ink-2); white-space: nowrap;
}
.chip .d { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.chip.good { background: var(--good-bg); color: var(--good); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.info { background: var(--info-bg); color: var(--info); }
.chip.gold { background: var(--gold-bg); color: var(--gold); }
.cat {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap;
}
.cat .pl { width: 12px; height: 12px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 3px var(--c), inset 0 0 0 4.5px var(--card); background: var(--c); }
.cdot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; background: var(--c); }
.delta { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.delta.up { color: var(--good); }
.delta.down { color: var(--bad); }
.delta.flat { color: var(--ink-3); }

/* boutons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 0 18px; border-radius: var(--r-ctl);
  border: 1px solid var(--line-2); background: var(--card); color: var(--ink);
  font-weight: 600; font-size: 15px; text-decoration: none; white-space: nowrap;
}
.btn:active { transform: translateY(1px); }
.btn svg { width: 18px; height: 18px; }
.btn.primary {
  background: var(--accent); color: var(--on-accent); border-color: var(--accent);
  font-family: var(--font-display); font-size: 19px; letter-spacing: 0.06em; text-transform: uppercase; min-height: 54px;
}
.btn.block { width: 100%; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.danger { color: var(--bad); border-color: var(--bad-bg); background: var(--bad-bg); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn[disabled] { opacity: 0.45; pointer-events: none; }
.iconbtn {
  width: 40px; height: 40px; display: grid; place-items: center; flex: none;
  border-radius: 12px; border: 0; background: transparent; color: var(--ink-2);
}
.iconbtn:active { background: var(--inset); }
.iconbtn svg { width: 22px; height: 22px; }
.seg { display: flex; background: var(--inset); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 9px; min-height: 36px; font-weight: 600; font-size: 14px; color: var(--ink-3); padding: 0 10px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.fchip { border: 1px solid var(--line-2); background: transparent; border-radius: 999px; padding: 5px 12px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }

/* champs */
.field { display: grid; gap: 6px; }
.field > span { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.input, .select, .textarea {
  width: 100%; min-height: 46px; padding: 10px 12px; border-radius: var(--r-ctl);
  border: 1px solid var(--line-2); background: var(--card); font-size: 16px; color: var(--ink);
}
.textarea { min-height: 80px; resize: vertical; }
.select { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.switch input { width: 46px; height: 28px; appearance: none; -webkit-appearance: none; background: var(--line-2); border-radius: 999px; position: relative; transition: background .2s; flex: none; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch input:checked { background: var(--good-mark); }
.switch input:checked::after { transform: translateX(18px); }

/* listes */
.list { display: grid; }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); min-width: 0; }
.li:first-child { border-top: 0; }
.li.tap { cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; color: inherit; font: inherit; }
.li .main { flex: 1; min-width: 0; }
.li .main .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .main .s { font-size: 13px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .side { text-align: right; flex: none; }
.li .chev { width: 16px; height: 16px; color: var(--ink-3); flex: none; }

/* constats */
.insights { display: grid; gap: 0; }
.ins { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); align-items: start; }
.ins:first-child { border-top: 0; padding-top: 2px; }
.ins .ic { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--inset); color: var(--ink-2); }
.ins .ic svg { width: 16px; height: 16px; }
.ins.good .ic { background: var(--good-bg); color: var(--good); }
.ins.bad .ic { background: var(--bad-bg); color: var(--bad); }
.ins.warn .ic { background: var(--warn-bg); color: var(--warn); }
.ins.info .ic { background: var(--info-bg); color: var(--info); }
.ins.record .ic { background: var(--gold-bg); color: var(--gold); }
.ins p { font-size: 14.5px; }
.ins .tt { font-weight: 600; margin-bottom: 2px; }

/* barre de la semaine : une barre et ses disques */
.week { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); align-items: center; padding: 4px 0 0; }
.week::before { content: ""; position: absolute; left: 7%; right: 7%; top: 23px; height: 4px; border-radius: 2px; background: var(--line-2); }
.wd { position: relative; display: grid; justify-items: center; gap: 6px; }
.wd .disc { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 2px dashed var(--c, var(--line-2)); color: var(--ink-3); font-family: var(--font-display); font-weight: 700; font-size: 14px; }
.wd .disc.done { border: 0; background: var(--c); color: #fff; box-shadow: inset 0 0 0 5px rgba(255,255,255,.18), inset 0 0 0 12px var(--c), inset 0 0 0 13.5px rgba(255,255,255,.35); }
.wd .disc.today { border-color: var(--ink); color: var(--ink); border-style: solid; }
.wd .disc.extra { border: 0; background: var(--c); color: #fff; }
.wd .lb { font-size: 12px; font-weight: 600; color: var(--ink-3); }
.wd .lb.today { color: var(--ink); }

/* focus */
.focus-card { display: grid; gap: 10px; }
.focus-card .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.focus-card .nm { font-weight: 700; font-size: 16px; line-height: 1.25; }
.focus-card .kpis { display: flex; gap: 18px; align-items: flex-end; flex-wrap: wrap; }
.focus-card .kpi .l { font-size: 12px; color: var(--ink-3); font-weight: 500; }
.focus-card .spark { width: 100%; height: 46px; }
.focus-card .next { display: flex; align-items: center; gap: 8px; padding: 9px 11px; background: var(--inset); border-radius: 10px; font-size: 13.5px; }
.focus-card .next svg { width: 16px; height: 16px; color: var(--ink-3); flex: none; }

/* graphiques */
.chart { position: relative; width: 100%; min-height: 200px; }
.chart svg { overflow: visible; }
.chart text { font-family: var(--font-body); font-size: 11.5px; fill: var(--ink-3); }
.chart .lbl-strong { fill: var(--ink); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink-2); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; background: var(--c); }
.legend i.dot { width: 9px; height: 9px; border-radius: 50%; }
.legend i.bar { width: 10px; height: 10px; border-radius: 3px; }
.legend i.ring { width: 10px; height: 10px; border-radius: 50%; background: transparent; box-shadow: inset 0 0 0 2px var(--c); }
.legend i.dash { background: repeating-linear-gradient(90deg, var(--c) 0 4px, transparent 4px 7px); }
.tip {
  position: absolute; pointer-events: none; z-index: 5; display: none;
  background: var(--pop); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--pop-shadow);
  padding: 7px 10px; font-size: 12.5px; white-space: nowrap;
}
.tip .t { color: var(--ink-3); margin-bottom: 3px; }
.tip .r { display: flex; align-items: center; gap: 7px; font-variant-numeric: tabular-nums; }
.tip .r b { font-weight: 700; }
.tip .k { width: 12px; height: 3px; border-radius: 2px; background: var(--c); flex: none; }
.ranges { display: flex; gap: 4px; }
.ranges button { border: 0; background: transparent; color: var(--ink-3); font-weight: 600; font-size: 13px; padding: 4px 8px; border-radius: 8px; }
.ranges button[aria-pressed="true"] { background: var(--inset); color: var(--ink); }
.tablewrap { overflow-x: auto; margin: 0 -2px; }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
table.t th { text-align: right; font-weight: 600; color: var(--ink-3); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { text-align: right; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t th:first-child, table.t td:first-child { text-align: left; padding-left: 2px; }
table.t tr:last-child td { border-bottom: 0; }

/* barre horizontale (classements) */
.hbars { display: grid; gap: 9px; }
.hb { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "n v" "t t"; gap: 3px 10px; align-items: center; font-size: 13.5px; }
.hb > .n { grid-area: n; }
.hb > .track { grid-area: t; }
.hb > .v { grid-area: v; }
@media (min-width: 640px) {
  .hb { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) auto; grid-template-areas: "n t v"; gap: 10px; }
}
.hb.g { grid-template-areas: "n t v"; }
.hb .n { min-width: 0; display: flex; align-items: center; gap: 7px; }
.hb .n > span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb .track { position: relative; height: 14px; }
.hb .track .zero { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--axis); }
.hb .track .bar { position: absolute; top: 2px; height: 10px; border-radius: 4px; background: var(--c); }
.hb .track .band { position: absolute; top: -2px; bottom: -2px; background: var(--inset); border-radius: 3px; }
.hb .v { font-weight: 600; font-variant-numeric: tabular-nums; min-width: 64px; text-align: right; }
.hb.tap { cursor: pointer; }

/* séance en cours : barre de rappel sur les autres écrans */
.live-bar {
  position: fixed; z-index: 34; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 10px);
  display: flex; align-items: center; gap: 10px;
  background: var(--accent); color: var(--on-accent);
  border: 0; border-radius: 999px; padding: 10px 16px 10px 14px; box-shadow: var(--pop-shadow);
  font-weight: 600; font-size: 14px; max-width: calc(100% - 32px); white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.live-bar .lb-t { overflow: hidden; text-overflow: ellipsis; }
.live-bar .pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--good-mark); flex: none; animation: beat 1.6s ease-in-out infinite; }
.live-bar.resting { background: var(--info); color: #fff; }
.live-bar.resting .pulse { background: #fff; }
.live-bar svg { width: 16px; height: 16px; flex: none; }
@keyframes beat { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@media (min-width: 900px) { .live-bar { bottom: 24px; } }

/* ── Écran de séance (plein écran, sans onglets) ── */
body.in-live .tabs { display: none; }
body.in-live .app { max-width: 640px; padding-bottom: calc(var(--dock-h, 100px) + 24px); }
.live-view { padding-top: 0; }
.lv-wrap { display: grid; gap: 14px; }

/* en-tête : séance, salle, chrono, avancement */
.lv-head {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: var(--bg); margin: 0 -16px; padding: 4px 16px 10px;
  border-bottom: 1px solid var(--line);
}
.lv-top { display: flex; align-items: center; gap: 4px; min-height: 54px; }
.lv-min { margin-left: -10px; }
.lv-title { flex: 1; min-width: 0; }
.lv-name { font-family: var(--font-display); font-weight: 700; font-size: 21px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lv-meta { display: flex; align-items: center; gap: 8px; margin-top: 3px; font-size: 13px; color: var(--ink-3); min-width: 0; white-space: nowrap; font-variant-numeric: tabular-nums; }
.lv-meta > span { overflow: hidden; text-overflow: ellipsis; }
.lv-clock { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: .01em; padding: 0 2px 0 6px; }
.lv-segs { display: flex; gap: 4px; margin-top: 6px; }
.lv-seg { flex: 1; min-width: 0; height: 18px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; }
.lv-seg.joined { margin-right: -3px; }
.lv-seg .tr { display: block; width: 100%; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.lv-seg .tr i { display: block; height: 100%; background: var(--c); border-radius: 3px; transition: width .3s; }
.lv-seg.cur .tr { height: 8px; box-shadow: 0 0 0 1.5px var(--ink); }

/* puces : salle (touchable) et repos */
.gchip, .mchip {
  display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 11px; border-radius: 999px;
  font-size: 13px; font-weight: 600; white-space: nowrap; max-width: 100%;
}
.gchip { border: 1px solid var(--line-2); background: var(--card); color: var(--ink); }
.gchip:active { background: var(--inset); }
.gchip.other { background: var(--info-bg); border-color: transparent; color: var(--info); }
.gchip svg { width: 15px; height: 15px; flex: none; }
.gchip svg.sw { width: 13px; height: 13px; color: var(--ink-3); margin-left: 1px; }
.gchip.other svg.sw { color: var(--info); }
.mchip { background: var(--inset); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.mchip svg { width: 15px; height: 15px; color: var(--ink-3); }
.mchip b { font-weight: 700; color: var(--ink); }
.lv-meta .gchip { height: 26px; padding: 0 9px; font-size: 12.5px; }

/* carte de l'exercice en cours */
.lv-card {
  position: relative; overflow: hidden;
  background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px 16px 14px;
  box-shadow: 0 1px 2px rgba(17, 20, 24, .04), 0 10px 28px rgba(17, 20, 24, .06);
  display: grid; gap: 16px;
}
.lv-card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--c); }
.lv-card.empty { justify-items: center; text-align: center; padding: 32px 16px; color: var(--ink-2); }
.lv-card.empty::before { display: none; }
.lv-card.empty svg { width: 44px; height: 44px; color: var(--ink-3); }
.lv-ssh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--ink-3); margin-bottom: -4px; }
.lv-ssh b { font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink); }
.lv-ssh svg { width: 16px; height: 16px; color: var(--ink); }
.lv-ex { display: grid; gap: 12px; min-width: 0; }
.lv-ex + .lv-ex { border-top: 2px dashed var(--line); padding-top: 18px; }
.lv-ex-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: -6px -8px -10px 0; }
.lv-kicker { display: flex; align-items: center; gap: 7px; font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lv-kicker .cdot { background: var(--c); }
.lv-ex-name { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.02; letter-spacing: .005em; }
.lv-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: -2px; }

/* notes */
.lv-notes { display: grid; gap: 6px; }
.lv-note {
  display: flex; gap: 9px; align-items: flex-start; text-align: left; width: 100%;
  border: 0; border-radius: 12px; padding: 10px 12px; background: var(--inset); color: var(--ink-2); font-size: 14px; line-height: 1.4;
}
.lv-note svg { width: 16px; height: 16px; flex: none; margin-top: 2px; color: var(--ink-3); }
.lv-note b { color: var(--ink); font-weight: 600; }
.lv-note.pin { background: var(--gold-bg); color: var(--ink); font-weight: 500; }
.lv-note.pin svg { color: var(--gold); }
.lv-note.prev { background: var(--info-bg); color: var(--ink); }
.lv-note.prev svg { color: var(--info); }
.lv-note.mine { background: var(--info-bg); color: var(--ink); }
.lv-note.mine svg { color: var(--info); }
.lv-note-ed { display: grid; gap: 8px; padding: 10px; border-radius: 14px; background: var(--inset); box-shadow: inset 0 0 0 2px var(--info); }
.lv-note-ed.pin { box-shadow: inset 0 0 0 2px var(--gold-mark); }
.lv-note-ed .textarea { min-height: 72px; background: var(--card); }
.note-seg button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; padding: 0 6px; }
.note-seg button svg { width: 14px; height: 14px; flex: none; }
.ne-acts { display: flex; align-items: center; gap: 6px; }
.ne-acts .sp { flex: 1; }
.btn.sm.dark { background: var(--accent); color: var(--on-accent); border-color: var(--accent); min-width: 64px; }
.btn.sm.danger svg { width: 15px; height: 15px; }

/* dernière fois → objectif du jour */
.lv-pb { border-radius: 16px; background: var(--inset); padding: 2px 14px; display: grid; --hl: var(--info); --hl-bg: var(--info-bg); }
.lv-pb.t-increase, .lv-pb.t-bridge { --hl: var(--good); --hl-bg: var(--good-bg); }
.lv-pb.t-restart, .lv-pb.t-consolidate { --hl: var(--warn); --hl-bg: var(--warn-bg); }
.pb-row { display: grid; gap: 1px; padding: 10px 0; min-width: 0; }
.pb-row + .pb-row { border-top: 1px solid var(--line); }
.pb-k { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.pb-k > span:not(.pb-tag) { font-size: 12.5px; font-weight: 500; letter-spacing: 0; text-transform: none; }
.pb-k > span:not(.pb-tag)::before { content: "· "; }
.pb-tag { font-size: 11.5px; font-weight: 700; letter-spacing: .02em; text-transform: none; color: var(--hl); background: var(--hl-bg); border-radius: 6px; padding: 1px 7px; }
.pb-v { font-family: var(--font-display); font-weight: 600; font-size: 21px; line-height: 1.15; font-variant-numeric: tabular-nums; color: var(--ink-2); overflow-wrap: anywhere; }
.pb-row.goal .pb-v { font-weight: 700; font-size: 27px; color: var(--ink); }
.pb-v em { font-style: normal; color: var(--hl); }
.pb-txt { font-size: 14px; color: var(--ink); margin-top: 3px; }
.pb-foot { display: flex; align-items: flex-start; gap: 8px; padding: 10px 0 11px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--ink-2); line-height: 1.4; }
.pb-foot > svg { width: 15px; height: 15px; flex: none; margin-top: 2px; color: var(--hl); }
.pb-rule { flex: 1; min-width: 0; }
.why-t { flex: none; display: inline-flex; align-items: center; gap: 2px; border: 0; background: none; padding: 0 0 0 4px; font-weight: 700; font-size: 13px; color: var(--ink); white-space: nowrap; }
.why-t svg { width: 15px; height: 15px; }
.pb-alt { display: flex; align-items: flex-start; gap: 8px; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: none; padding: 10px 0 11px; font-size: 13.5px; font-weight: 600; color: var(--ink); }
.pb-alt svg { width: 15px; height: 15px; flex: none; margin-top: 2px; color: var(--ink-3); }
.lv-why { display: grid; gap: 9px; padding: 2px 0 12px; font-size: 14px; color: var(--ink-2); line-height: 1.45; }
.lv-why .w1 { color: var(--ink); }
.lv-why .ln { display: flex; gap: 8px; align-items: flex-start; }
.lv-why .ln svg { width: 15px; height: 15px; flex: none; margin-top: 3px; color: var(--ink-3); }
.lv-why .linkrow { justify-self: start; padding: 2px 0; font-size: 13.5px; color: var(--ink); }

/* séries */
.lv-sets { display: grid; gap: 2px; }
.lv-set {
  display: grid; grid-template-columns: 34px minmax(0, 1fr) auto 50px; align-items: center; gap: 10px;
  min-height: 48px; padding: 6px 6px 6px 4px; border-radius: 12px; border: 0; background: transparent;
  text-align: left; width: 100%; color: inherit;
}
.lv-set:active { background: var(--inset); }
.lv-set .n {
  width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 700; font-size: 15px; background: var(--inset); color: var(--ink-3);
}
.lv-set .n svg { width: 17px; height: 17px; }
.lv-set.done .n { background: var(--good-mark); color: #fff; }
.lv-set.pr .n { background: var(--gold-mark); color: #1b1400; }
.lv-set.t-w .n { background: var(--info-bg); color: var(--info); }
.lv-set.pop .n { animation: burst .55s ease-out; }
.lv-set .v { font-family: var(--font-display); font-weight: 600; font-size: 21px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lv-set .v small { font-family: var(--font-body); font-size: 12px; font-weight: 600; color: var(--ink-3); }
.lv-set.todo .v { color: var(--ink-3); font-weight: 500; }
.lv-set .dl { font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.lv-set .dl.up { color: var(--good); }
.lv-set .dl.down { color: var(--bad); }
.lv-set .dl.ok { color: var(--ink-3); font-weight: 600; }
.lv-set .rs { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; justify-content: flex-end; gap: 3px; }
.lv-set .rs svg { width: 12px; height: 12px; }

.lv-edit { background: var(--inset); border-radius: 16px; padding: 10px; display: grid; gap: 10px; box-shadow: inset 0 0 0 2px var(--ink); margin: 3px 0; }
.lv-edit.is-done { box-shadow: inset 0 0 0 2px var(--good-mark); }
.lv-edit-h { display: flex; align-items: center; gap: 10px; }
.lv-edit-h .n { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--card); font-family: var(--font-display); font-weight: 700; font-size: 15px; flex: none; }
.lv-edit.is-done .lv-edit-h .n { background: var(--good-mark); color: #fff; }
.lv-edit-h .tt { flex: 1; min-width: 0; display: grid; }
.lv-edit-h .tt b { font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: .06em; text-transform: uppercase; }
.lv-edit-h .hints { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lv-edit-h .hints .hg { color: var(--ink); font-weight: 600; }
.lv-edit-h .iconbtn { width: 36px; height: 36px; margin-right: -4px; }
.lv-steps { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stp { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; background: var(--card); border-radius: 14px; height: 70px; border: 1px solid var(--line); }
.stp:focus-within { border-color: var(--ink-3); }
.stp > button { height: 70px; border: 0; background: transparent; color: var(--ink-2); font-size: 28px; font-weight: 500; line-height: 1; padding: 0; display: grid; place-items: center; }
.stp > button:active { color: var(--ink); background: var(--inset); }
.stp > button:first-child { border-radius: 14px 0 0 14px; }
.stp > button:last-child { border-radius: 0 14px 14px 0; }
.stp .mid { display: grid; justify-items: center; align-content: center; min-width: 0; cursor: text; }
.stp input {
  width: 100%; min-width: 0; height: 40px; border: 0; background: transparent; text-align: center; padding: 0;
  font-family: var(--font-display); font-weight: 700; font-size: 34px; color: var(--ink); font-variant-numeric: tabular-nums;
}
.stp input.long { font-size: 28px; }
.stp input::placeholder { color: var(--ink); opacity: .4; }
.stp input:focus { outline: none; }
.stp .u { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-top: -1px; }
.lv-add { display: inline-flex; align-items: center; gap: 8px; justify-self: start; border: 0; background: transparent; color: var(--ink-2); font-weight: 600; font-size: 14px; padding: 8px 6px; border-radius: 10px; }
.lv-add svg { width: 17px; height: 17px; }
.lv-add:active { background: var(--inset); }
.lv-add.note { margin-top: -6px; }

/* résultat et ressenti */
.lv-res { display: flex; align-items: center; gap: 10px; padding: 11px 13px; border-radius: 12px; font-weight: 600; font-size: 14.5px; }
.lv-res svg { width: 18px; height: 18px; flex: none; }
.lv-res.good { background: var(--good-bg); color: var(--good); }
.lv-res.warn { background: var(--warn-bg); color: var(--warn); }
.lv-res.bad { background: var(--bad-bg); color: var(--bad); }
.lv-res.neutral { background: var(--inset); color: var(--ink-2); }
.lv-feel { display: grid; gap: 8px; }
.lv-feel .lbl { font-size: 13.5px; font-weight: 700; color: var(--ink); }
.lv-feel .lbl span { font-weight: 500; color: var(--ink-3); }
.lv-feel .opts { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.lv-feel button {
  min-height: 52px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--card); color: var(--ink-2);
  display: grid; place-items: center; align-content: center; gap: 1px; padding: 4px 2px; min-width: 0;
}
.lv-feel button .d { font-family: var(--font-display); font-weight: 700; font-size: 18px; line-height: 1; color: var(--fc); }
.lv-feel button .t { font-size: 11.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.lv-feel button[aria-pressed="true"] { background: var(--fc); border-color: var(--fc); color: #fff; }
.lv-feel button[aria-pressed="true"] .d { color: #fff; }
.lv-feel.ask { padding: 10px; margin: 0 -10px; border-radius: 14px; background: var(--warn-bg); }
.lv-feel.ask button { border-color: var(--ink-3); }

/* reste de la séance */
.lv-list { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 4px 14px 6px; }
.lv-list-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0 10px; }
.seg.mini { padding: 2px; border-radius: 10px; flex: none; }
.seg.mini button { min-height: 30px; font-size: 12.5px; padding: 0 9px; border-radius: 8px; }
.lv-grp { border-top: 1px solid var(--line); }
.lv-grp.ss { position: relative; }
.lv-grp.ss::before { content: ""; position: absolute; left: 10px; top: 24px; bottom: 24px; width: 2px; background: var(--line-2); border-radius: 1px; }
.lv-row {
  position: relative; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  width: 100%; padding: 11px 0; border: 0; background: none; text-align: left; color: inherit;
}
.lv-grp .lv-row + .lv-row { border-top: 1px dashed var(--line); }
.lv-row .st { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-2); display: grid; place-items: center; background: var(--card); position: relative; z-index: 1; }
.lv-row .st svg { width: 13px; height: 13px; }
.lv-row.done .st { background: var(--good-mark); border-color: var(--good-mark); color: #fff; }
.lv-row.cur .st { border-color: var(--ink); box-shadow: inset 0 0 0 3px var(--card), inset 0 0 0 9px var(--ink); }
.lv-row.part .st { border-color: var(--good-mark); background: conic-gradient(var(--good-mark) var(--p), var(--card) 0); }
.lv-row .nm { min-width: 0; display: grid; gap: 1px; }
.lv-row .l1 { display: flex; align-items: center; gap: 6px; min-width: 0; }
.lv-row .l1 .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lv-row.cur .l1 .t { font-weight: 700; }
.lv-row.done .l1 .t { color: var(--ink-2); }
.lv-row .l2 { font-size: 13px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.lv-row.done .l2 { color: var(--ink-2); }

(function (root) {

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function dayStr(n) { return new Date(n * DAY).toISOString().slice(0, 10); }

  }
  function weekStartNum(n) { return n - (((n + 3) % 7) + 7) % 7; } // lundi
  function weekday(d) { return (((dayNum(d) + 3) % 7) + 7) % 7; } // 0 = lundi … 6 = dimanche

  function sum(a) { var s = 0; for (var i = 0; i < a.length; i++) s += a[i]; return s; }

    var s = a.slice().sort(function (x, y) { return x - y; });
    var m = s.length >> 1;
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;

  // Valeur suivie pour la progression selon le type d'exercice

  /* Tendance lissée (régression locale robuste, type LOWESS) évaluée chaque semaine.

  /* Analyse complète d'un exercice. */

  // ───────────────────────── Objectif du jour ─────────────────────────

  /* Part de reps gardée à chaque série par rapport à la 1re (séances récentes à charge unique). */

  /* Objectif du jour d'un exercice, dans une salle donnée.

    // Indice de force chaîné, par mois et par catégorie (base 100 au premier mois)

    // Classement des exercices par vitesse
    var ranked = Object.keys(ex).map(function (id) { return ex[id]; }).filter(function (A) {
      return A.kind === 'kg' && A.speedAll !== null && A.nUsed >= 8 && A.spanDays >= 60 && lib[A.id] && !lib[A.id].hidden;
    });
    ranked.sort(function (a, b) { return b.speedAll - a.speedAll; });
    R.ranking = ranked.map(function (A) { return { id: A.id, speed: A.speedAll, gain: A.gainPct, n: A.nUsed, status: A.status, daysPerIncrease: A.daysPerIncrease, jump: A.currentJumpPct }; });

    // Temps avant d'augmenter : médiane par exercice puis médiane des exercices
    var perEx = ranked.filter(function (A) { return A.increases.length >= 2; }).map(function (A) {
      return { id: A.id, days: A.daysPerIncrease, sessions: A.sessionsPerIncrease, n: A.increases.length, jump: A.currentJumpPct, speed: A.speedAll };
    });
    R.increaseStats = {
      perExercise: perEx.sort(function (a, b) { return a.days - b.days; }),
      medianDays: perEx.length ? median(perEx.map(function (x) { return x.days; })) : null,
      medianSessions: perEx.length ? median(perEx.map(function (x) { return x.sessions; })) : null,
      total: sum(ranked.map(function (A) { return A.increases.length; }))
    };
    // Lien entre taille du saut de charge (%) et temps pour l'atteindre
    var pairs = [];
    ranked.forEach(function (A) { A.increases.forEach(function (x) { if (x.jumpPct > 0 && x.jumpPct < 40) pairs.push([x.jumpPct, x.days]); }); });
    R.jumpVsDays = { n: pairs.length, rho: spearman(pairs.map(function (p) { return p[0]; }), pairs.map(function (p) { return p[1]; })) };
    var small = pairs.filter(function (p) { return p[0] <= 5; }).map(function (p) { return p[1]; });
    var big = pairs.filter(function (p) { return p[0] >= 8; }).map(function (p) { return p[1]; });
    R.jumpVsDays.smallMedian = small.length ? Math.round(median(small)) : null; R.jumpVsDays.smallN = small.length;
    R.jumpVsDays.bigMedian = big.length ? Math.round(median(big)) : null; R.jumpVsDays.bigN = big.length;

    // Records récents (tous exercices)
    var feed = [], RANK = { load: 3, metric: 2, reps: 1 };
    Object.keys(ex).forEach(function (id) {
      var bySid = {};
      (ex[id].events || []).forEach(function (e) {
        if (e.type === 'volume') return;
        var cur = bySid[e.sid];
        if (!cur || RANK[e.type] > RANK[cur.type]) bySid[e.sid] = Object.assign({ id: id, kind: ex[id].kind }, e);
      });
      Object.keys(bySid).forEach(function (k) { feed.push(bySid[k]); });
    });
    feed.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    R.prFeed = feed;
    var months = {};
    feed.forEach(function (e) { var m = e.date.slice(0, 7); months[m] = (months[m] || 0) + 1; });
    R.prByMonth = months;

    // Durée des séances
    R.durations = S.filter(function (s) { return s.durationMin; }).map(function (s) { return { date: s.date, min: s.durationMin, cat: s._cat }; });
    return R;
  }

  function spearman(x, y) {
    if (x.length < 5) return null;
    function ranks(a) {
      var idx = a.map(function (v, i) { return [v, i]; }).sort(function (p, q) { return p[0] - q[0]; });
      var r = new Array(a.length);
      for (var i = 0; i < idx.length;) {
        var j = i; while (j + 1 < idx.length && idx[j + 1][0] === idx[i][0]) j++;
        for (var k = i; k <= j; k++) r[idx[k][1]] = (i + j) / 2 + 1;

    var rx = ranks(x), ry = ranks(y), mx = mean(rx), my = mean(ry);
    var num_ = 0, dx = 0, dy = 0;
    for (var i = 0; i < x.length; i++) { num_ += (rx[i] - mx) * (ry[i] - my); dx += (rx[i] - mx) * (rx[i] - mx); dy += (ry[i] - my) * (ry[i] - my); }
    return dx > 0 && dy > 0 ? round(num_ / Math.sqrt(dx * dy), 2) : null;
  }

  /* Indice chaîné : d'un mois au suivant, moyenne géométrique des variations
   * du 1RM estimé médian des exercices faits les deux mois. Les exercices qui
   * arrivent ou disparaissent ne faussent donc pas la courbe. */
  function strengthIndex(ex, lib) {
    var cats = ['Tout', 'Push', 'Pull', 'Legs'];
    var monthly = {};
    Object.keys(ex).forEach(function (id) {
      var A = ex[id];
      if (A.kind !== 'kg' || !A.used || A.used.length < 4 || !lib[id] || lib[id].hidden) return;
      var byM = {};
      A.used.forEach(function (p) { var m = p.date.slice(0, 7); (byM[m] || (byM[m] = [])).push(p.e1rm); });
      Object.keys(byM).forEach(function (m) { (monthly[m] || (monthly[m] = {}))[id] = median(byM[m]); });
    });
    var ms = Object.keys(monthly).sort();
    var out = {};
    cats.forEach(function (c) {
      var idx = [], v = 100;
      for (var i = 0; i < ms.length; i++) {
        var cur = monthly[ms[i]];
        var ids = Object.keys(cur).filter(function (id) { return c === 'Tout' || (lib[id] && lib[id].cat === c); });
        if (i === 0 || !idx.length) { if (ids.length) idx.push({ month: ms[i], value: 100, n: ids.length }); continue; }
        var prev = monthly[ms[i - 1]];
        var common = ids.filter(function (id) { return prev[id] > 0; });
        if (common.length) {
          var lg = mean(common.map(function (id) { return Math.log(cur[id] / prev[id]); }));
          v = v * Math.exp(lg);
        }
        if (ids.length) idx.push({ month: ms[i], value: round(v, 1), n: common.length });
      }
      out[c] = idx;
    });
    return out;
  }

  // ───────────────────────── Bilan d'une séance ─────────────────────────
  function sessionReport(session, all) {
    var lib = all.lib, ex = all.ex;
    var rep = { id: session.id, items: [], records: [], form: null };
    var forms = [];
    var totalSets = 0, totalVol = 0, totalReps = 0;
    var cfg = all.cfg || gymCfg();
    (session.exercises || []).forEach(function (e) {
      var id = exKey(e, session, lib, cfg);
      var L = lib[id] || { name: e.ex, kind: 'kg', cat: 'Autre' };
      var A = ex[id];
      var ws = workingSets(e);
      if (!ws.length) return;
      totalSets += ws.length;
      ws.forEach(function (x) { totalVol += (x.w || 0) * (x.r || 0); totalReps += x.r || 0; });
      var pts = A ? A.points : [];
      var k = -1;
      for (var i = 0; i < pts.length; i++) if (pts[i].sid === session.id) { k = i; break; }
      var me = k >= 0 ? pts[k] : null;
      var prevAll = pts.slice(0, k >= 0 ? k : pts.length).filter(function (p) { return !p.excluded && !p.anomaly; });
      var prev = prevAll.length ? prevAll[prevAll.length - 1] : null;
      var gym = e.gym || session.gym || null;
      var item = { id: id, name: L.name, cat: L.cat, kind: L.kind, sets: ws, me: me, prev: prev, gym: gym, gymSplit: !!L.gymSplit,
        feel: e.feel || null, note: e.note || '', restAvg: me ? me.restAvg : null, restPlan: e.rest || null };
      // objectif du jour (enregistré pendant la séance, sinon recalculé depuis la séance précédente) et résultat
      var tgt = e.target && e.target.sets ? { kind: L.kind, type: e.target.type || 'reps', title: e.target.title || '', sets: e.target.sets.map(function (x) { return { w: x[0], r: x[1], s: x[2] || 0 }; }) } : null;
      if (!tgt && prev) tgt = objective({ used: prevAll, kind: L.kind, breaks: [] }, L, { today: session.date, nSets: ws.length });
      if (tgt && tgt.type !== 'first') { item.target = tgt; item.result = evaluate(tgt, ws, L, e.feel); }
      if (me && prev) {
        var M = function (p) { return metricOf(p, L.kind); };
        item.deltaLoad = round(loadOf(me, L.kind) - loadOf(prev, L.kind), 2);
        item.deltaReps = me.reps - prev.reps;
        item.deltaMetricPct = M(prev) > 0 ? round((M(me) / M(prev) - 1) * 100, 1) : null;
        item.deltaVolumePct = prev.volume > 0 ? round((me.volume / prev.volume - 1) * 100, 1) : null;
        item.daysSincePrev = me.d - prev.d;
        // forme : comparé à la médiane des 3 séances précédentes
        var base = median(prevAll.slice(-3).map(M));
        if (base > 0 && prevAll.length >= 3 && !me.excluded) { item.form = round((M(me) / base - 1) * 100, 1); forms.push(M(me) / base - 1); }
        // records battus pendant cette séance
        var bestBefore = Math.max.apply(null, prevAll.map(M));
        var loadBefore = Math.max.apply(null, prevAll.map(function (p) { return loadOf(p, L.kind); }));
        if (!me.excluded && !me.anomaly) {
          if (loadOf(me, L.kind) > loadBefore + 1e-9) rep.records.push({ id: id, name: L.name, type: 'load', value: loadOf(me, L.kind), reps: me.topR, before: loadBefore, kind: L.kind });
          else if (M(me) > bestBefore * 1.0001) rep.records.push({ id: id, name: L.name, type: 'metric', value: round(M(me), 1), before: round(bestBefore, 1), w: me.bestW, r: me.bestR, kind: L.kind });
          else if (L.kind === 'kg') {
            var bestAt = 0;
            prevAll.forEach(function (p) { p.sets.forEach(function (s) { if (s.w === me.topW && s.r > bestAt) bestAt = s.r; }); });
            if (bestAt > 0 && me.topR > bestAt) rep.records.push({ id: id, name: L.name, type: 'reps', value: me.topW, reps: me.topR, before: bestAt, kind: L.kind });
          }
        }
      } else if (me && !prev) item.first = true;
      // historique récent pour la mini-courbe
      item.spark = pts.slice(Math.max(0, k - 9), k + 1).filter(function (p) { return !p.anomaly; }).map(function (p) { return { d: p.d, v: metricOf(p, L.kind), me: p.sid === session.id }; });
      // objectif suivant calculé à partir de cette séance
      if (me && A && A.plan && A.used.length && A.used[A.used.length - 1].sid === session.id) item.plan = A.plan;
      else if (me) item.plan = objective({ used: pts.slice(0, k + 1).filter(function (p) { return !p.excluded && !p.anomaly; }), kind: L.kind, breaks: [] }, L, { today: session.date });

    rep.totalSets = totalSets; rep.totalVolume = round(totalVol); rep.totalReps = totalReps;
    rep.form = forms.length >= 2 ? round(median(forms) * 100, 1) : (forms.length === 1 ? round(forms[0] * 100, 1) : null);
    rep.formN = forms.length;
    // comparaison avec la séance précédente du même type
    var cat = catOfSession(session, lib).main;
    rep.cat = cat;
    var earlier = all.sessions.filter(function (s) { return s.date < session.date && s._cat === cat; });
    var same = null;
    for (var i = earlier.length - 1; i >= 0; i--) { if (!session.template || earlier[i].template === session.template || !earlier[i].template) { same = earlier[i]; break; } }
    if (same) {
      var v2 = 0, n2 = 0;
      same.exercises.forEach(function (e) { workingSets(e).forEach(function (x) { v2 += (x.w || 0) * (x.r || 0); n2++; }); });
      rep.prevSame = { id: same.id, date: same.date, name: same.name, volume: round(v2), sets: n2, durationMin: same.durationMin || null };
      rep.volumeDeltaPct = v2 > 0 ? round((totalVol / v2 - 1) * 100, 1) : null;
    }
    rep.takeaways = typoList(takeaways(session, rep, all));
    return rep;
  }

  function nameOf(id, lib) { return lib[id] ? (lib[id].displayName || lib[id].name) : id; }
  function kg(x) { return fmtNum(x) + '\u00a0kg'; }
  function pctTxt(x, d) { return (x > 0 ? '+' : x < 0 ? '−' : '') + fmtNum(Math.abs(x), d === undefined ? 1 : d) + '\u00a0%'; }

  function takeaways(session, rep, all) {
    var out = [];
    var lib = all.lib;
    rep.records.forEach(function (r) {
      if (r.type === 'load') out.push({ tone: 'record', text: 'Nouveau record de charge sur ' + r.name + ' : ' + kg(r.value) + ' × ' + r.reps + ' (avant : ' + kg(r.before) + ').' });
      else if (r.type === 'metric') out.push({ tone: 'record', text: r.name + ' : meilleure performance estimée (' + kg(r.value) + ' de 1RM estimé, avec ' + kg(r.w) + ' × ' + r.r + ').' });
      else out.push({ tone: 'record', text: r.name + ' : ' + r.reps + ' reps à ' + kg(r.value) + ', ton record de reps à cette charge (avant : ' + r.before + ').' });
    });
    if (rep.form !== null && rep.formN >= 2) {
      if (rep.form >= 3) out.push({ tone: 'good', text: 'Très bonne forme : en moyenne ' + pctTxt(rep.form) + ' au-dessus de tes 3 séances précédentes sur les mêmes exercices.' });
      else if (rep.form <= -4) out.push({ tone: 'bad', text: 'Séance en dessous de ta forme habituelle (' + pctTxt(rep.form) + ' par rapport à tes 3 séances précédentes). Sommeil, fatigue ou alimentation : un jour sans arrive, à surveiller si ça se répète.' });
      else out.push({ tone: 'neutral', text: 'Performance dans ta moyenne récente (' + pctTxt(rep.form) + ' par rapport à tes 3 séances précédentes).' });
    }
    var withT = rep.items.filter(function (it) { return it.result; });
    if (withT.length >= 2) {
      var ok = withT.filter(function (it) { return it.result.met || it.result.validated; }).length;
      out.push({ tone: ok === withT.length ? 'good' : ok * 2 >= withT.length ? 'neutral' : 'warn', text: 'Objectif du jour atteint sur ' + ok + ' exercice' + (ok > 1 ? 's' : '') + ' sur ' + withT.length + '.' });
    }
    var vals = rep.items.filter(function (it) { return it.result && it.result.validated; });
    if (vals.length) out.push({ tone: 'good', text: 'Palier validé sur ' + vals.map(function (it) { return it.name + ' (' + kg(it.result.nextLoad) + ' la prochaine fois)'; }).join(', ') + '.' });
    var poor = rep.items.filter(function (it) { return it.feel && it.feel <= 2; });
    if (poor.length) out.push({ tone: 'warn', text: 'Exécution à revoir sur ' + poor.map(function (it) { return it.name + ' (« ' + FEEL[it.feel] + ' »)'; }).join(', ') + ' : la prochaine fois, mêmes charges pour consolider.' });
    var downs = rep.items.filter(function (it) { return it.deltaMetricPct !== null && it.deltaMetricPct !== undefined && it.deltaMetricPct <= -8 && it.daysSincePrev <= 21 && !(it.deltaLoad < 0); });
    if (downs.length) out.push({ tone: 'bad', text: 'Net recul par rapport à la dernière fois sur ' + downs.map(function (it) { return it.name + ' (' + pctTxt(it.deltaMetricPct, 0) + ')'; }).join(', ') + '.' });
    var lighter = rep.items.filter(function (it) { return it.deltaLoad < 0 && it.kind === 'kg' && it.prev; });
    if (lighter.length) out.push({ tone: 'neutral', text: 'Charge allégée sur ' + lighter.map(function (it) { return it.name + ' (' + fmtNum(loadOf(it.prev, 'kg')) + ' → ' + kg(loadOf(it.me, 'kg')) + ')'; }).join(', ') + '.' });
    if (rep.volumeDeltaPct !== null && rep.volumeDeltaPct !== undefined && Math.abs(rep.volumeDeltaPct) >= 10) {
      out.push({ tone: 'neutral', text: 'Volume total ' + (rep.volumeDeltaPct > 0 ? 'en hausse' : 'en baisse') + ' de ' + fmtNum(Math.abs(rep.volumeDeltaPct), 0) + ' % par rapport à ta dernière séance ' + rep.cat + '.' });
    }
    var firsts = rep.items.filter(function (it) { return it.first; });
    if (firsts.length) out.push({ tone: 'neutral', text: 'Première fois sur ' + firsts.map(function (it) { return it.name; }).join(', ') + ' : ces chiffres servent de point de départ.' });
    return out;
  }

  // ───────────────────────── Programme déduit des séances ─────────────────────────
  function inferProgram(sessions, lib) {
    var groups = {};
    sessions.forEach(function (s) {
      var c = catOfSession(s, lib).main;
      var hasPush = false, hasPull = false;
      s.exercises.forEach(function (e) { var L = lib[resolveId(e.ex, lib)]; if (L && L.cat === 'Push') hasPush = true; if (L && L.cat === 'Pull') hasPull = true; });
      var key = hasPush && hasPull ? 'Upper' : c;

    var tpl = [];
    Object.keys(groups).forEach(function (k) {
      var list = groups[k];
      if (list.length < 3) return;
      var last = list[list.length - 1];
      tpl.push({ id: slug(names[k] || k), name: names[k] || k, days: [], exercises: last.exercises.map(function (e) { return { ex: resolveId(e.ex, lib), sets: Math.max(2, workingSets(e).length) }; }) });
    });
    return { templates: tpl, schedule: {} };
  }

  // ───────────────────────── Lecture des chiffres : constats et pistes ─────────────────────────
  function fmtDay(d) {
    var M = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
    return (+d.slice(8, 10)) + ' ' + M[+d.slice(5, 7) - 1];
  }
  function weeksTxt(days) {
    if (days === null || days === undefined) return '—';
    if (days < 14) return days + ' jours';
    var w = days / 7;
    return (w < 10 ? fmtNum(round(w, 1)) : Math.round(w)) + ' semaines';
  }

  /* Pourquoi un exercice avance (ou pas) : constats tirés des séances. */
  function diagnose(A, L, all) {
    var out = [];
    if (!A || !A.used || !A.used.length || A.kind !== 'kg') return out;
    var cur = A.current;
    // Taille de la marche
    var jumps = [];
    Object.keys(all.ex).forEach(function (id) { var B = all.ex[id]; if (B.kind === 'kg' && B.currentJumpPct && B.status !== 'arrete' && B.nUsed >= 8) jumps.push(B.currentJumpPct); });
    var medJump = median(jumps);
    var jNow = cur && cur.load > 0 ? round(L.inc / cur.load * 100, 1) : null;
    if (jNow && medJump && jNow >= 1.25 * medJump && jNow >= 7) {
      var isDb = /halt[eè]re/i.test(L.name || '') || (L.strongNames || []).some(function (n) { return /dumbbell/i.test(n); });
      out.push({ tone: 'warn', title: 'Grosse marche', text: 'Passer de ' + kg(cur.load) + ' à ' + kg(round(cur.load + L.inc, 2)) + ' représente +' + fmtNum(jNow, 1) + ' %, contre +' + fmtNum(medJump, 1) + ' % en médiane sur tes autres exercices.' +
        (isDb ? ' C\'est typique des haltères : chaque palier demande plus de temps.' : ' Plus la marche est grande par rapport à ta charge, plus elle demande de temps à franchir.') +
        (all.jumpVsDays && all.jumpVsDays.bigMedian && all.jumpVsDays.smallMedian ? ' Dans ton historique, une marche de 8 % ou plus prend ' + all.jumpVsDays.bigMedian + ' jours en médiane, contre ' + all.jumpVsDays.smallMedian + ' jours pour une marche de 5 % ou moins.' : '') });
    }
    // Chute des reps d'une série à l'autre à la charge de travail
    var recent = A.used.slice(-6);
    var drops = recent.map(function (p) { var r = p.repsAtTop; return r.length >= 2 ? r[0] - r[r.length - 1] : null; }).filter(function (x) { return x !== null; });
    var md = median(drops);
    if (md !== null && md >= 3) {
      out.push({ tone: 'neutral', title: 'Chute de reps d\'une série à l\'autre', text: 'Sur tes 6 dernières séances, tu perds en médiane ' + md + ' reps entre ta première et ta dernière série à la charge de travail (dernière fois : ' + recent[recent.length - 1].repsAtTop.join(' · ') + '). Un repos un peu plus long entre les séries aide souvent à garder les reps.' });
    }
    // Temps passé sur la charge actuelle vs habitude
    var curStage = A.stages[A.stages.length - 1];
    if (A.daysPerIncrease && curStage && curStage.days > 2 * A.daysPerIncrease && curStage.days > 42 && A.status !== 'reprise') {
      out.push({ tone: 'warn', title: 'Palier plus long que d\'habitude', text: 'Ta charge max (' + kg(curStage.load) + ', atteinte le ' + fmtDay(curStage.start) + ') n\'a pas été dépassée depuis ' + weeksTxt(curStage.days) + '. D\'habitude, tu passes à la charge suivante en ' + weeksTxt(A.daysPerIncrease) + '.' });
    }
    // Reps max à la charge de travail actuelle vs record de reps
    if (A.repsAtWeight && cur) {
      var atCur = A.repsAtWeight.filter(function (x) { return x.w === cur.load; })[0];
      if (atCur && atCur.r > cur.reps) out.push({ tone: 'neutral', title: 'Ton meilleur à cette charge', text: 'À ' + kg(cur.load) + ', ton record est de ' + atCur.r + ' reps (' + fmtDay(atCur.date) + '). Dernière séance : ' + cur.reps + ' reps sur la première série.' });
    }
    // Fréquence
    var span = A.used.filter(function (p) { return dayNum(A.last) - p.d <= 56; }).length;
    var before = A.used.filter(function (p) { var dd = dayNum(A.last) - p.d; return dd > 56 && dd <= 168; }).length / 2;
    if (before >= 4 && span <= before * 0.6) out.push({ tone: 'neutral', title: 'Moins souvent qu\'avant', text: 'Tu as fait cet exercice ' + span + ' fois ces 8 dernières semaines, contre environ ' + fmtNum(round(before, 0)) + ' fois par période de 8 semaines avant.' });
    if (A.sinceBreak) out.push({ tone: 'info', title: 'Reprise après une pause', text: 'Pause de ' + A.sinceBreak.days + ' jours (' + fmtDay(A.sinceBreak.from) + ' → ' + fmtDay(A.sinceBreak.to) + '). Tu es aujourd\'hui à ' + fmtNum(100 + A.sinceBreak.nowPct, 0) + ' % de ton niveau d\'avant la pause.' });
    return out;
  }

  /* Constats globaux, du plus important au moins important. */
  function insights(all, settings) {
    settings = settings || {};
    var lib = all.lib, out = [];
    if (!all.sessions || !all.sessions.length) return out;
    var focus = (settings.focus || []).filter(function (id) { return all.ex[id]; });
    focus.forEach(function (id, i) {
      var A = all.ex[id], L = lib[id];
      if (!A.current) return;
      var t = null;
      var perf = function (load, reps) { return A.kind === 'kg' ? kg(load) + ' × ' + reps : fmtNum(load, 0) + (A.kind === 'reps' ? ' reps' : ' s'); };

    if (rel3.length) body.push(h('section', { class: 'card' }, h('div', { class: 'h3' }, 'Force relative'), h('p', { class: 'small muted', style: { margin: '2px 0 10px' } }, '1RM estimé actuel divisé par ton poids de corps'),
      h('div', { class: 'tiles' }, rel3.map(function (x) { return tile(exName(x.id), '× ' + nf(x.r, 2), 'ton poids de corps'); }))));
  }
  if (B.length) body.push(h('section', { class: 'card', style: { padding: '4px 16px' } }, h('div', { class: 'list' }, B.slice().reverse().slice(0, 40).map(function (x) {
    return h('div', { class: 'li' }, h('div', { class: 'main' }, h('div', { class: 't' }, nf(x.kg, 1) + ' kg'), h('div', { class: 's' }, fdate(x.date, { year: true }))),
      h('button', { class: 'iconbtn', 'aria-label': 'Supprimer cette pesée', onclick: function () { App.data.body = App.data.body.filter(function (y) { return y !== x; }); Store.saveDoc('body', { entries: App.data.body }); render(false); }, html: icon('trash') }));
  }))));
  return { title: 'Poids de corps', sub: 'Pesées de ta balance', body: body };
};

// ───────── Méthode ─────────

    H('Tendance et vitesse (dérivée)'),
    P('La tendance est une régression locale robuste (type LOWESS) calculée chaque semaine sur environ 5 semaines de séances : elle lisse les jours sans et ignore les séances aberrantes. Sa pente donne la vitesse de progression en % par mois. Une pause de 4 semaines ou plus coupe la courbe.'),
    P('La « vitesse 90 jours » et la vitesse sur tout l\'historique utilisent une pente de Theil-Sen (médiane des pentes entre toutes les paires de séances), peu sensible aux séances ratées.'),
    H('Statuts'),
    P('En progression : plus de +1 % par mois sur 90 jours. En baisse : moins de −1 %. Plateau : tendance plate et pas de record depuis 60 jours. En reprise : tu remontes vers ton record après une baisse ou une pause. Plus pratiqué : pas fait depuis 45 jours.'),

    P('Ajustements : après 3 semaines sans l\'exercice, reprise à environ 90 % (80 % après 8 semaines). Si l\'exécution a été notée 1 ou 2 la dernière fois, mêmes charges et mêmes reps pour consolider. Si tu es bloqué depuis longtemps (plus de 8 semaines et deux fois ton rythme habituel) et que la marche suivante est grosse (7 % ou plus), une série lourde à la charge suivante est proposée, avec l\'option « +1 rep » à côté. La fourchette et la marche se règlent pour chaque exercice.'),

    H('Ressenti d\'exécution'),

// ───────── Import Strong ─────────
function pickFile(accept, cb) {
  var inp = h('input', { type: 'file', accept: accept, style: { position: 'fixed', left: '-9999px' } });
  inp.addEventListener('change', function () {
    var f = inp.files && inp.files[0];
    inp.remove();
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () { cb(String(rd.result), f.name); };
    rd.onerror = function () { toast('Impossible de lire ce fichier', '', 'alert'); };
    rd.readAsText(f, 'utf-8');
  });
  document.body.appendChild(inp);
  inp.click();
}
function pickStrongFile() { pickFile('.csv,text/csv,text/plain', function (text, name) { previewStrongImport(text, name); }); }

function sessionSig(s) { return JSON.stringify([s.name, s.durationMin, s.gym || '', s.exercises.map(function (e) { return [e.ex, e.gym || '', e.sets.map(function (x) { return [x.w, x.r, x.s || 0, x.t]; })]; })]); }
function previewStrongImport(text, name) {
  var res;
  try { res = E.strongToSessions(text, { resolve: E.makeResolver(App.data.overrides), gyms: gymList(), home: homeGym() }); }
  catch (e) { Sheet.open('Import impossible', h('div', null, h('p', null, e.message), h('div', { class: 'acts' }, h('button', { class: 'btn block', onclick: Sheet.close }, 'OK')))); return; }
  var byId = {}, appDates = {};
  App.data.sessions.forEach(function (s) { byId[s.id] = s; if (s.source !== 'strong' || s.edited) appDates[s.date] = 1; });
  var add = [], upd = [], same = 0, skip = 0;
  res.sessions.forEach(function (s) {
    if (appDates[s.date]) { skip++; return; }
    var cur = byId[s.id];
    if (!cur) add.push(s);
    else if (cur.excluded !== undefined && sessionSig(cur) === sessionSig(s)) same++;
    else if (sessionSig(cur) === sessionSig(s)) same++;
    else { if (cur.excluded) s.excluded = true; upd.push(s); }
  });
  var inFile = {};
  res.sessions.forEach(function (s) { inFile[s.id] = 1; });
  var missing = App.data.sessions.filter(function (s) { return s.source === 'strong' && !s.edited && !inFile[s.id]; }).length;
  var unknown = Object.keys(res.unknown).map(function (k) { return res.unknown[k]; });
  var ops = add.concat(upd);
  Sheet.open('Import Strong', h('div', { class: 'stack' },
    h('p', { class: 'muted small' }, name + ' · ' + res.sessions.length + ' jours d\'entraînement lus'),
    h('dl', { class: 'kv' },
      h('dt', null, 'Nouvelles séances'), h('dd', null, String(add.length)),
      h('dt', null, 'Séances modifiées dans Strong'), h('dd', null, String(upd.length)),
      h('dt', null, 'Déjà à jour'), h('dd', null, String(same)),
      skip ? h('dt', null, 'Ignorées (saisies dans l\'app ce jour-là)') : null, skip ? h('dd', null, String(skip)) : null,
      missing ? h('dt', null, 'Absentes du fichier (conservées)') : null, missing ? h('dd', null, String(missing)) : null),
    unknown.length ? h('p', { class: 'small' }, 'Exercices nouveaux, classés automatiquement : ' + unknown.join(', ') + '.') : null,
    h('div', { class: 'acts' },
      h('button', { class: 'btn primary block', disabled: !ops.length, onclick: function () { runImport(ops); } }, ops.length ? 'Importer ' + ops.length + ' séance' + (ops.length > 1 ? 's' : '') : 'Rien à importer'),
      h('button', { class: 'btn block ghost', onclick: Sheet.close }, 'Fermer'))));
}
function runImport(ops) {
  var bar = h('i', { style: { width: '0%' } });
  var lbl = h('p', { class: 'small muted' }, 'Préparation…');
  Sheet.open('Import en cours', h('div', { class: 'stack' }, h('div', { class: 'progress' }, bar), lbl), { modal: true });
  ops.forEach(function (s) {
    App.data.sessions = App.data.sessions.filter(function (x) { return x.id !== s.id; });
    App.data.sessions.push(s);
  });
  App.data.sessions.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  Store.bulk(ops.map(function (s) { return { t: 'set', s: s }; }), function (d, n) { bar.style.width = Math.round(d / n * 100) + '%'; lbl.textContent = d + ' / ' + n + ' séances enregistrées'; })
    .then(function (r) {
      Sheet.close();
      recompute();
      Nav.root('home');
      toast(ops.length + ' séance' + (ops.length > 1 ? 's importées' : ' importée') + (r && r.failed ? ' (' + r.failed + ' en attente d\'envoi)' : ''), '', 'check');
    });
}

// ───────── Sauvegardes ─────────
function download(filename, text, mime) {
  var go = function (dl) {
    if (dl) {
      dl.save({ filename: filename, data: text }).then(function () { toast('Fichier prêt', '', 'check'); }, function (e) {
        if (e && e.code === 'declined') return;
        toast('Téléchargement impossible : ' + (e && e.message ? e.message : 'erreur'), '', 'alert');
      });
      return;
    }
    // iPhone (app sur l'écran d'accueil) : feuille de partage → « Enregistrer dans Fichiers »
    try {
      if (typeof File === 'function' && navigator.canShare) {
        var f = new File([text], filename, { type: mime });
        if (navigator.canShare({ files: [f] })) {
          navigator.share({ files: [f], title: filename }).then(function () { markBackup(filename); }, function () {});
          return;
        }
      }
    } catch (e) {}
    try {
      var blob = new Blob([text], { type: mime });
      var a = h('a', { href: URL.createObjectURL(blob), download: filename, style: { display: 'none' } });
      document.body.appendChild(a); a.click();
      markBackup(filename);
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    } catch (e) { toast('Téléchargement impossible dans ce navigateur', '', 'alert'); }
  };
  if (window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then(go, function () { go(null); });
  else go(null);
}
/* Dernière sauvegarde exportée (rappel dans l'app quand les données ne sont que sur l'appareil) */
function markBackup(filename) { if (/\.json$/.test(filename)) { try { localStorage.setItem('carnet-muscu:lastBackup', String(Date.now())); } catch (e) {} } }
function lastBackupAt() { try { return +localStorage.getItem('carnet-muscu:lastBackup') || 0; } catch (e) { return 0; } }
function exportBackup() {
  var data = { app: 'carnet-muscu', version: 2, exportedAt: new Date().toISOString(), sessions: App.data.sessions.map(function (x) { var o = {}; Object.keys(x).forEach(function (k) { if (k.charAt(0) !== '_') o[k] = x[k]; }); return o; }), settings: App.data.settings, overrides: App.data.overrides, program: App.data.program, body: App.data.body, notes: App.data.notes || {} };
  download('carnet-muscu-' + today() + '.json', JSON.stringify(data), 'application/json');
}
function exportCSV() {
  var q = function (v) { v = v === null || v === undefined ? '' : String(v); return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  var lines = ['Date,Heure,Séance,Exercice,Catégorie,Série,Type,Poids (kg),Reps,Secondes,1RM estimé'];
  App.all.sessions.forEach(function (s) {
    s.exercises.forEach(function (e) {
      var n = 0;
      e.sets.forEach(function (x) { if (x.t === 'n') n++; lines.push([s.date, s.time || '', s.name, exName(e.ex), (lib(e.ex) || {}).cat || '', x.t === 'n' ? n : '', TYPE_LABEL[x.t] || '', x.w || 0, x.r || 0, x.s || '', E.round(E.e1rm(x.w, x.r), 1) || ''].map(q).join(',')); });
    });
  });
  download('carnet-muscu-series-' + today() + '.csv', '﻿' + lines.join('\n'), 'text/csv');
}
function pickBackupFile() {
  pickFile('.json,application/json', function (text) {
    var d;
    try { d = JSON.parse(text); } catch (e) { toast('Fichier illisible', '', 'alert'); return; }
    if (!d || d.app !== 'carnet-muscu' || !Array.isArray(d.sessions)) { toast('Ce fichier n\'est pas une sauvegarde du carnet', '', 'alert'); return; }
    confirmSheet('Restaurer cette sauvegarde ?', d.sessions.length + ' séances (exportées le ' + (d.exportedAt || '').slice(0, 10) + '). Ton carnet actuel (' + App.data.sessions.length + ' séances) sera remplacé.', 'Restaurer', function () {
      var old = App.data.sessions.map(function (s) { return s.id; });
      var keep = {};
      d.sessions.forEach(function (s) { keep[s.id] = 1; });
      var ops = d.sessions.map(function (s) { return { t: 'set', s: s }; }).concat(old.filter(function (id) { return !keep[id]; }).map(function (id) { return { t: 'del', id: id }; }));
      App.data.settings = Object.assign({}, DEFAULT_SETTINGS, d.settings || {});
      App.data.sessions = d.sessions.map(function (s) { return E.normalizeSession(s, gymCfg()); });
      App.data.notes = d.notes || {};
      savePins();
      App.data.overrides = d.overrides || {};
      App.data.program = d.program || null;
      App.data.body = d.body || [];
      Store.saveDoc('settings', { settings: App.data.settings });
      Store.saveDoc('library', { overrides: App.data.overrides });
      if (App.data.program) Store.saveDoc('program', { program: App.data.program });
      Store.saveDoc('body', { entries: App.data.body });
      var bar = h('i', { style: { width: '0%' } });
      Sheet.open('Restauration', h('div', { class: 'progress' }, bar), { modal: true });
      Store.bulk(ops, function (k, n) { bar.style.width = Math.round(k / n * 100) + '%'; }).then(function () { Sheet.close(); recompute(); Nav.root('home'); toast('Sauvegarde restaurée', '', 'check'); });
    });
  });
}
function resetAll() {
  var inp = h('input', { class: 'input', id: 'reset-confirm', placeholder: 'EFFACER', autocomplete: 'off' });
  Sheet.open('Tout effacer ?', h('div', { class: 'stack' },
    h('p', { class: 'muted' }, 'Toutes tes séances, ton programme et tes réglages seront supprimés. Exporte une sauvegarde avant si tu veux pouvoir revenir en arrière. Tape EFFACER pour confirmer.'),
    inp,
    h('div', { class: 'acts' }, h('button', { class: 'btn danger block', onclick: function () {
      if (inp.value.trim().toUpperCase() !== 'EFFACER') { toast('Tape EFFACER pour confirmer', '', 'alert'); return; }
      var ids = App.data.sessions.map(function (s) { return s.id; });
      Sheet.close();
      Store.wipe(ids, ['settings', 'library', 'program', 'body', 'draft']).then(function () {
        App.data = { sessions: [], settings: clone(DEFAULT_SETTINGS), overrides: {}, program: null, body: [], draft: null };
        recompute(); Nav.root('home'); toast('Carnet effacé', '', 'trash');
      });
    } }, 'Tout effacer'), h('button', { class: 'btn ghost block', onclick: Sheet.close }, 'Annuler'))));
}
